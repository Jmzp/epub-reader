<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curl Lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d3c7; font: 13px system-ui; }
      #stage { position: fixed; inset: 0; }
      canvas { position: absolute; left: 0; top: 0; }
      #hud { position: fixed; right: 8px; top: 8px; background: rgba(0,0,0,.7); color: #fff; padding: 6px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; pointer-events: auto; }
      #hud button { margin-left: 6px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="gl"></canvas></div>
    <div id="hud"><span id="stats">–</span><button id="mode">spread</button><button id="prev">◀</button><button id="next">▶</button></div>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
