name: Windows ARM64 build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    # Native ARM64 runner: builds and runs tests on the same architecture as the Surface.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: lector-epub-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/epub-reader.exe
